plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashtube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ashtube.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // Enables direct installation of release builds
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

// Automatically sync web assets into Android app assets directory before build
task syncWebAssets(type: Copy) {
    from("${project.rootDir}") {
        include 'index.html'
        include 'style.css'
        include 'app.js'
        include 'manifest.json'
        include 'catalog.json'
        include 'livetv_channels.json'
        include 'assets/**'
    }
    into "${project.projectDir}/src/main/assets"
}

preBuild.dependsOn syncWebAssets
