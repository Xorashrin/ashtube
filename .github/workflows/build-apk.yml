name: Build AshTube Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package AshTube APK (5-8 MB)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Official Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ashtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ashtube2026 \
            -keypass ashtube2026 \
            -dname "CN=ASRAFUL ISLAM, OU=AshTube, O=AshTube, L=Dhaka, C=BD"

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p app/src/main/assets/assets
          cp index.html style.css app.js manifest.json catalog.json livetv_channels.json app/src/main/assets/
          cp -r assets/* app/src/main/assets/assets/

      - name: Build Android Release & Debug APK
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare & Verify APK Artifacts
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/AshTube.apk
            cp app/build/outputs/apk/release/app-release.apk release-apks/AshTube-v2.0.0-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/AshTube-v2.0.0-debug.apk
          fi
          echo "=== Generated APK Files & Sizes ==="
          ls -lh release-apks/
          echo "=== Verifying APK Signature Schemes ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose release-apks/AshTube.apk

      - name: Upload AshTube APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AshTube-v2.0.0-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "AshTube v2.0.0 — Real Source Engine"
          body: |
            ### AshTube v2.0.0 — Real Source Engine
            **Developed by ASRAFUL ISLAM**

            - **BDIX index engine:** 8 BDIX servers (DhakaFlix x5, Discovery FTP, CTGFun, FTP-146) crawled into a local SQLite index, instant title lookups.
            - **Verified matching:** exact title + year + season/episode, live Range probe, and real-duration check, so a thumbnail never opens different content.
            - **HiAnime** sub/dub HLS with subtitles, **Cinemeta / Kitsu / kisskh / TVMaze** live catalogs, upcoming-episode countdowns.
            - Seek, pause, resume and multi-thread download on every source; stream proxy for CORS and failover.
            - Run the backend with `python3 server.py` and enter its address in the app (Live TV tab).

            #### Download
            - **[AshTube.apk](https://github.com/Xorashrin/ashtube/releases/download/v2.0.0/AshTube.apk)**
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
