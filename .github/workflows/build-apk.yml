name: Build AshTube Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package AshTube APK (5-8 MB)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android Release & Debug APK
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare & Verify APK Artifacts
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/AshTube-v1.0.0-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/AshTube-v1.0.0-debug.apk
          fi
          echo "=== Generated APK Files & Sizes ==="
          ls -lh release-apks/

      - name: Upload AshTube APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AshTube-v1.0.0-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AshTube v1.0.0 — Official Android Release"
          body: |
            ### AshTube — Stream & Multi-Thread Download
            **Developed by ASRAFUL ISLAM**

            #### Highlights:
            - **Super-Fast Native Android APK** (Ultra-compact 5–8 MB footprint)
            - **Hardware-Accelerated Streaming** with 0-latency offline UI loading
            - **High-Speed Multi-Thread Downloader Engine** (Segmented HTTP Range parallel chunking)
            - **Universal BDIX Peering Scanner & Direct Streams** (CircleFTP, Discovery, AmberIT, SAM Online)
            - **12+ Live TV Channels** with HLS failover & instant player
            - **Developer Welcome Screen**: "Developed by ASRAFUL ISLAM"

            #### Download:
            Download **AshTube-v1.0.0-release.apk** below and install on any Android 7.0+ device.
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
